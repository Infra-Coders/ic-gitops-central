apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ic-monitoring-stack
  namespace: flux-system
spec:
  url: https://github.com/Infra-Coders/ic-monitoring-stack.git
  ref:
    branch: feature/initial-setup
  interval: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ic-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: ic-aws
  sourceRef:
    kind: GitRepository
    name: ic-monitoring-stack
  path: ./clusters/base
  prune: true
  interval: 5m
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring
