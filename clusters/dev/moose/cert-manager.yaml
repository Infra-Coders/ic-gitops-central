apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ic-cert-manager-stack
  namespace: flux-system
spec:
  url: https://github.com/Infra-Coders/ic-cert-manager-stack.git
  ref:
    tag: v0.0.1
  interval: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ic-cert-manager
  namespace: flux-system
spec:
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ic-cert-manager-stack
  path: ./clusters/dev
  prune: true
  interval: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ic-cert-manager-clusterissuer
  namespace: flux-system
spec:
  dependsOn:
    - name: ic-cert-manager
  sourceRef:
    kind: GitRepository
    name: ic-cert-manager-stack
  path: ./clusters/dev/clusterissuer
  prune: true
  interval: 2m
